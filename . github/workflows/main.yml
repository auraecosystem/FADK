name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install Hardhat dependencies
        run: |
          cd fadaka-blockchain
          npm install

      - name: Run pipeline
        run: bash scripts/ci_pipeline.sh
      
      cache-from:
  - type=gha
cache-to:
  - type=gha,mode=max
context: .
file: Dockerfile
platforms:
  - linux/amd64
  - linux/arm64
provenance: builder-id=https://github.com/auraecosystem/FADK/actions/runs/28562824456/attempts/1
push: true
sbom: 'true'
tags:
  - ghcr.io/auraecosystem/fadaka-node:latest
target: runtime
